<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OSINT Catalog — каталог инструментов сквада">
  <title>OSINT Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="brand-mark">⌘</span>
      <span>OSINT Catalog</span>
    </a>

    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="Переключить тему" aria-label="Переключить тему">☼</button>
      <a class="admin-link" href="#admin">Admin</a>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Категории</div>
      <button class="category active" data-category="all">
        <span>Все инструменты</span><span class="count" id="allCount">0</span>
      </button>
      <div id="categoryNav"></div>
    </aside>

    <section class="content">
      <div class="hero">
        <div>
          <div class="eyebrow">SQUAD TOOLKIT</div>
          <h1>OSINT Catalog</h1>
          <p>Лёгкий каталог инструментов для команды.</p>
        </div>

        <div class="stats">
          <div><strong id="toolCount">0</strong><span>инструментов</span></div>
          <div><strong id="categoryCount">0</strong><span>категорий</span></div>
        </div>
      </div>

      <div class="toolbar">
        <label class="search">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="Поиск инструмента..." autocomplete="off">
          <kbd>Ctrl K</kbd>
        </label>
        <button class="sort-btn" id="sortBtn">A–Я</button>
      </div>

      <div id="catalog"></div>

      <div class="empty hidden" id="empty">
        <div class="empty-icon">⌕</div>
        <h3>Ничего не найдено</h3>
        <p>Попробуй изменить запрос или выбрать другую категорию.</p>
      </div>
    </section>
  </main>

  <footer>
    <span>OSINT Catalog</span>
    <span>Static HTML / CSS / JS</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
